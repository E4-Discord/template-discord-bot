name: Deploy

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*'
    paths:
      - 'src/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/discord-bot-template

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-latest:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', 'master')
    steps:
      - name: Pull Image
        run: |
          REGISTRY_AUTH=$(echo -n '{"username":"${{ github.actor }}","password":"${{ secrets.GITHUB_TOKEN }}","serveraddress":"${{ env.REGISTRY }}"}' | base64)

          curl -X POST "https://${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.ENDPOINT_ID }}/docker/images/create?fromImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
               -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
               -H "X-Registry-Auth: $REGISTRY_AUTH"
      - name: Update Portainer Stack
        run: |
          STACK_FILE_CONTENT=$(\
            curl -X GET "https://${{ secrets.PORTAINER_URL }}/api/stacks/${{ secrets.STACK_ID_LATEST }}/file?endpointId=${{ secrets.ENDPOINT_ID }}" \
                 -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
                 | jq -r '.StackFileContent')

          PAYLOAD=$(jq -n \
            --arg content "$STACK_FILE_CONTENT" \
            --argjson id "${{ secrets.STACK_ID_LATEST }}" \
            '{
              id: $id,
              stackFileContent: $content,
              prune: true,
              pullImage: true
            }')

          curl -X PUT "https://${{ secrets.PORTAINER_URL }}/api/stacks/${{ secrets.STACK_ID_LATEST }}?endpointId=${{ secrets.ENDPOINT_ID }}" \
               -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD"

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', 'develop')
    steps:
      - name: Pull Image
        run: |
          REGISTRY_AUTH=$(echo -n '{"username":"${{ github.actor }}","password":"${{ secrets.GITHUB_TOKEN }}","serveraddress":"${{ env.REGISTRY }}"}' | base64)

          curl -X POST "https://${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.ENDPOINT_ID }}/docker/images/create?fromImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev" \
               -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
               -H "X-Registry-Auth: $REGISTRY_AUTH"
      - name: Update Portainer Stack
        run: |
          STACK_FILE_CONTENT=$(\
            curl -X GET "https://${{ secrets.PORTAINER_URL }}/api/stacks/${{ secrets.STACK_ID_DEV }}/file?endpointId=${{ secrets.ENDPOINT_ID }}" \
                 -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
                 | jq -r '.StackFileContent')

          PAYLOAD=$(jq -n \
            --arg content "$STACK_FILE_CONTENT" \
            --argjson id "${{ secrets.STACK_ID_DEV }}" \
            '{
              id: $id,
              stackFileContent: $content,
              prune: true,
              pullImage: true
            }')

          curl -X PUT "https://${{ secrets.PORTAINER_URL }}/api/stacks/${{ secrets.STACK_ID_DEV }}?endpointId=${{ secrets.ENDPOINT_ID }}" \
               -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD"