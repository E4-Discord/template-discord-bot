name: Deploy

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*'
    paths:
      - 'src/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PACKAGE_NAME: discord-bot-template
  IMAGE_NAME: ${{ github.repository_owner }}/discord-bot-template

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}

      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            COMMIT_SHA=${{ env.SHORT_SHA }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    steps:
      - name: Set up environment variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "STACK_ID=${{ secrets.STACK_ID_LATEST }}" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "STACK_ID=${{ secrets.STACK_ID_DEV }}" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Pull image
        run: |
          REGISTRY_AUTH=$(echo -n '{"username":"${{ github.actor }}","password":"${{ secrets.GITHUB_TOKEN }}","serveraddress":"${{ env.REGISTRY }}"}' | base64 -w 0)

          IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          curl -X POST "https://${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.ENDPOINT_ID }}/docker/images/create?fromImage=${{ env.REGISTRY }}/$IMAGE_NAME:${{ env.IMAGE_TAG }}" \
               -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
               -H "X-Registry-Auth: $REGISTRY_AUTH"

      - name: Update portainer stack
        run: |
          STACK_ENV=$(curl -s -X GET "https://${{ secrets.PORTAINER_URL }}/api/stacks/${{ env.STACK_ID }}?endpointId=${{ secrets.ENDPOINT_ID }}" \
               -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
               | jq -r '.Env // []')

          STACK_FILE_CONTENT=$(\
            curl -s -X GET "https://${{ secrets.PORTAINER_URL }}/api/stacks/${{ env.STACK_ID }}/file?endpointId=${{ secrets.ENDPOINT_ID }}" \
                 -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
                 | jq -r '.StackFileContent')

          PAYLOAD=$(jq -n \
            --arg content "$STACK_FILE_CONTENT" \
            --argjson id "${{ env.STACK_ID }}" \
            --argjson env "$STACK_ENV" \
            '{
              id: $id,
              stackFileContent: $content,
              env: $env,
              prune: true,
              pullImage: true
            }')

          curl -X PUT "https://${{ secrets.PORTAINER_URL }}/api/stacks/${{ env.STACK_ID }}?endpointId=${{ secrets.ENDPOINT_ID }}" \
               -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD"

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write 
    steps:
      - name: Delete old untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 3

      - name: Prune untagged images on Portainer
        run: |
          curl -X POST "https://${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.ENDPOINT_ID }}/docker/images/prune?filters=%7B%22dangling%22%3A%5B%22true%22%5D%7D" \
               -H "X-API-Key:${{ secrets.PORTAINER_TOKEN }}"